# Construit la version web et la publie sur GitHub Pages a chaque push.
#
# Rien a installer sur ta machine : GitHub telecharge Godot, exporte le jeu et
# met le site a jour tout seul. Le lien reste le meme d'une fois sur l'autre.
name: Publier la version web

on:
  push:
    branches:
      - claude/admiring-lovelace-2n21q9
      - main
  # Permet aussi de relancer la publication a la main depuis l'onglet Actions.
  workflow_dispatch:

# Droits necessaires au deploiement sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois ; une nouvelle remplace celle en attente.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Exporter le jeu
    runs-on: ubuntu-latest
    # Filet de securite : sans cela, un telechargement bloque consommerait des
    # heures de quota sans rien produire.
    timeout-minutes: 25
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Godot et ses modeles d'exportation
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          curl -sSL --retry 3 -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          curl -sSL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/* "$TEMPLATE_DIR/"

          godot --version

      - name: Importer les ressources
        # Premier import : Godot construit son cache. Il signale l'absence de la
        # scene principale tant que le cache n'existe pas, d'ou le `|| true`.
        run: godot --headless --import || true

      - name: Exporter en HTML5
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          # Sans ce fichier, GitHub Pages ignore les noms commencant par un
          # underscore et applique un traitement Jekyll dont on n'a pas besoin.
          touch build/web/.nojekyll
          ls -la build/web

      # Le jeu est aussi telechargeable depuis l'onglet Actions, meme si la
      # publication sur Pages echoue. Pratique pour l'essayer tout de suite, ou
      # pour deposer l'archive sur itch.io.
      - name: Mettre le jeu a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: race-web
          path: build/web
          retention-days: 30

      # `enablement: true` demande a GitHub de creer le site Pages s'il
      # n'existe pas encore. Cela echoue sur un depot prive sans abonnement
      # GitHub Pro, ou Pages n'est tout simplement pas disponible : l'API
      # repond alors « Resource not accessible by integration ». Sur un depot
      # public, la creation passe.
      - name: Configurer Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Expliquer comment activer Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages n'est pas active sur ce depot."
          echo "A faire une seule fois :"
          echo "  1. Settings > Pages"
          echo "  2. Source : GitHub Actions"
          echo "  3. Relancer ce workflow (onglet Actions > Publier la version web > Run workflow)"
          echo ""
          echo "Depot prive : GitHub Pages y demande un abonnement GitHub Pro."
          echo "Sur un compte gratuit, rendre le depot public d'abord :"
          echo "  Settings > General > Danger Zone > Change visibility."
          echo ""
          echo "En attendant, le jeu est telechargeable sur cette page,"
          echo "section « Artifacts » : race-web."
          exit 1

      - name: Preparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
