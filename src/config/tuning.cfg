; =============================================================================
;  RACE - TOUS LES REGLAGES DU JEU
; =============================================================================
;
;  Ce fichier est le SEUL endroit a modifier pour changer le ressenti de
;  conduite, la camera, la remise en piste et les taux reseau.
;  Aucune de ces valeurs n'est ecrite en dur dans le code.
;
;  COMMENT L'UTILISER
;    1. Modifie une valeur, sauvegarde.
;    2. Relance le jeu (ou le serveur). Pas de recompilation necessaire.
;    3. En multijoueur, seul le fichier du SERVEUR compte : il envoie ses
;       reglages a chaque client a la connexion, pour que la prediction du
;       client donne exactement le meme resultat que la simulation du serveur.
;
;  UNITES
;    distances en metres, vitesses en metres/seconde, angles en degres,
;    durees en secondes.  Reperes de vitesse : 30 m/s = 108 km/h,
;    45 m/s = 162 km/h, 60 m/s = 216 km/h.
;
; =============================================================================


; -----------------------------------------------------------------------------
[vehicle]
; Moteur, freins et direction. C'est ici que se joue l'essentiel du plaisir.
; -----------------------------------------------------------------------------

; Acceleration a plein gaz, en m/s². Plus haut = depart plus nerveux.
;   20 = tranquille | 28 = arcade franc (defaut) | 40 = fusee
engine_acceleration = 28.0

; Vitesse maximale en marche avant, en m/s.
;   35 = 126 km/h | 45 = 162 km/h (defaut) | 60 = 216 km/h
max_speed = 45.0

; Vitesse maximale en marche arriere, en m/s.
max_reverse_speed = 12.0

; Puissance de freinage, en m/s². Nettement superieure a l'acceleration pour
; que le frein reponde immediatement.
brake_force = 55.0

; Deceleration quand on relache les gaz sans freiner (frein moteur), en m/s².
; Monte cette valeur si la voiture "plane" trop en roue libre.
engine_braking = 9.0

; Resistance au roulement, proportionnelle a la vitesse (1/s). Limite surtout
; la vitesse de pointe et adoucit la fin d'acceleration.
rolling_resistance = 0.06

; Vitesse de rotation maximale de la voiture quand on braque a fond, en degres
; par seconde. C'est le reglage n°1 de la vivacite en virage.
;   90 = paquebot | 145 = arcade net (defaut) | 220 = toupie
steer_rate = 145.0

; A vitesse maximale, on ne conserve que ce pourcentage du braquage ci-dessus.
; Sans cette attenuation, la voiture pivoterait sur elle-meme a pleine vitesse.
;   0.20 = tres stable en ligne droite | 0.35 (defaut) | 0.60 = nerveux partout
steer_rate_at_max_speed = 0.35

; Rapidite avec laquelle le braquage atteint sa valeur demandee (1/s).
; Bas = direction molle et progressive, haut = direction immediate et sèche.
;   6 = douce | 10 = reactive (defaut) | 20 = brutale
steer_response = 10.0

; Angle visuel maximal des roues avant, en degres. Purement esthetique,
; sans effet sur la conduite.
steer_visual_angle = 32.0

; Braquage conserve en l'air (sur une rampe), entre 0 et 1.
; 0 = aucun controle en vol, 1 = comme au sol.
air_steer_factor = 0.30


; -----------------------------------------------------------------------------
[grip]
; Adherence et derapage. LE coeur du ressenti arcade.
;
; Principe : la voiture avance dans une direction, son nez pointe dans une
; autre. L'adherence est la vitesse a laquelle la trajectoire rattrape le nez.
;   adherence elevee  -> la voiture est "sur des rails"
;   adherence faible  -> la voiture glisse, elle derape
; -----------------------------------------------------------------------------

; Adherence laterale en conduite normale (1/s).
;   4 = savonneux | 7 = arcade equilibre (defaut) | 14 = colle a la route
lateral_grip = 7.0

; Adherence laterale pendant le frein a main. C'est ce qui declenche le
; derapage. Doit rester bien inferieure a lateral_grip.
;   0.4 = patinoire | 0.9 = derapage franc et rattrapable (defaut) | 2.5 = discret
handbrake_grip = 0.9

; Rotation supplementaire pendant un derapage, en pourcentage de steer_rate.
; C'est ce qui fait "pivoter" la voiture quand on tire le frein a main.
;   0.0 = le frein a main ne fait que glisser | 0.45 (defaut) | 1.0 = tete-a-queue
handbrake_yaw_boost = 0.45

; Freinage applique par le frein a main sur la vitesse avant, en m/s².
; Garder faible : en arcade, le frein a main sert a tourner, pas a s'arreter.
handbrake_braking = 6.0

; Vitesse de retour en adherence apres un derapage (1/s). Bas = la voiture
; reste longtemps en glisse apres avoir relache, haut = elle se recolle net.
;   1.5 = glisse longue et joueuse | 3.5 (defaut) | 8.0 = reprise immediate
grip_recovery = 3.5

; Vitesse minimale pour pouvoir declencher un derapage, en m/s.
; Evite de partir en toupie a l'arret.
drift_min_speed = 7.0

; Rappel qui ramene le nez de la voiture vers sa trajectoire pendant un
; derapage. C'est ce reglage qui rend la glisse CONTROLABLE : sans lui, rien ne
; s'oppose a la rotation et la voiture part systematiquement en tete-a-queue.
; Plus la valeur est haute, plus l'angle de derive reste modeste.
; Angles de derive mesures apres 1,5 s de frein a main a 108 km/h, braquage a
; fond (tools/tests/drift_probe.tscn) :
;   0.0 = 86 deg : tete-a-queue systematique, la voiture s'arrete
;   1.4 = 47 deg : glisse tres large, difficile a tenir
;   2.0 = 32 deg : glisse franche et rattrapable (defaut)
;   2.6 = 25 deg : glisse sage
;   5.0 = la voiture se remet droite presque toute seule
drift_slip_damping = 2.0

; Adherence supplementaire gagnee a vitesse maximale (effet appui aerodynamique).
; 0.0 = aucun effet | 0.35 (defaut) = +35 % d'adherence a fond, stabilise les
; longues courbes rapides.
downforce_grip_bonus = 0.35


; -----------------------------------------------------------------------------
[ground]
; Contact avec le sol, gravite et murs.
; -----------------------------------------------------------------------------

; Gravite appliquee au vehicule, en m/s². Bien superieure a la gravite reelle
; (9,8) : en arcade, une voiture qui retombe lentement parait flottante.
;   18 = sauts longs et planants | 28 = arcade (defaut) | 45 = tres seche
gravity = 28.0

; Hauteur du chassis au-dessus du sol, en metres.
ride_height = 0.42

; Longueur des rayons qui cherchent le sol, en metres. Doit rester superieure
; a ride_height, sinon la voiture "decroche" sur les bosses.
ground_ray_length = 1.30

; Rapidite avec laquelle la voiture se plaque a la hauteur de repos (1/s).
; Haut = colle au sol, bas = suspension molle qui rebondit.
ground_snap_speed = 14.0

; Rapidite avec laquelle la voiture s'aligne sur la pente du terrain (1/s).
align_to_ground_speed = 12.0

; Rapidite de retour a l'horizontale quand la voiture est en l'air (1/s).
align_in_air_speed = 2.5

; Energie conservee lors d'un choc contre un mur, entre 0 et 1.
;   0.0 = la voiture s'arrete net | 0.25 (defaut) = rebond leger | 0.7 = flipper
wall_bounce = 0.25

; Vitesse avant perdue lors d'un choc frontal contre un mur, entre 0 et 1.
wall_speed_loss = 0.45


; -----------------------------------------------------------------------------
[respawn]
; Remise en piste automatique.
; -----------------------------------------------------------------------------

; Au-dela de cette inclinaison (en degres par rapport a la verticale), la
; voiture est consideree retournee.
upside_down_angle = 65.0

; Duree pendant laquelle la voiture doit rester retournee ou bloquee avant la
; remise en piste automatique, en secondes.
stuck_time = 3.0

; En dessous de cette vitesse (m/s), la voiture est consideree immobile.
stuck_speed = 1.5

; Sous cette altitude, la voiture est tombee hors de la piste : remise en piste
; immediate.
fall_height = -25.0

; Hauteur a laquelle la voiture reapparait au-dessus du point de reapparition.
spawn_height = 1.0


; -----------------------------------------------------------------------------
[camera]
; Camera a la troisieme personne. Touche C pour changer de vue.
; -----------------------------------------------------------------------------

; Distance derriere la voiture, en metres (vue arriere par defaut).
chase_distance = 6.8

; Hauteur au-dessus de la voiture, en metres.
chase_height = 2.5

; Rapidite de suivi de la camera (1/s). Bas = beaucoup de retard, sensation de
; lourdeur ; haut = camera rigide collee a la voiture.
;   4 = tres flottante | 9 = leger retard agreable (defaut) | 20 = rigide
follow_speed = 9.0

; Rapidite avec laquelle la camera se tourne vers la direction visee (1/s).
look_speed = 11.0

; Recul supplementaire a vitesse maximale, en metres. Renforce la sensation
; d'acceleration.
speed_pullback = 2.5

; Inclinaison de la camera dans les virages, en degres a braquage maximal.
;   0 = aucune | 4 (defaut) | 12 = tres marquee
corner_tilt = 4.0

; Champ de vision au repos, en degres. Plus la valeur est haute, plus la voiture
; parait petite a l'ecran et plus le decor defile vite sur les cotes.
base_fov = 68.0

; Champ de vision gagne a vitesse maximale, en degres. C'est le principal
; effet de "vitesse ressentie".
;   0 = aucun effet | 16 (defaut) | 30 = tres marque
speed_fov_gain = 14.0

; Distance et hauteur des deux autres vues (touche C).
close_distance = 4.5
close_height = 1.9
hood_forward = 0.35
hood_height = 1.15


; -----------------------------------------------------------------------------
[network]
; Taux d'envoi, prediction et interpolation.
; Voir docs/NOTES.md pour l'explication de la boucle complete.
; -----------------------------------------------------------------------------

; Frequence de simulation physique, en Hz. Serveur et client DOIVENT utiliser
; la meme valeur, sinon la prediction derive. 60 est le bon choix.
physics_tick_rate = 60

; Frequence d'envoi de l'etat du monde par le serveur, en Hz.
; Bas = moins de bande passante mais interpolation plus molle.
;   10 = economique | 20 = bon compromis (defaut) | 30 = tres fluide
state_send_rate = 20

; Frequence d'envoi des entrees par le client, en Hz. Doit rester egale a
; physics_tick_rate : une entree manquante fait deviner le serveur.
input_send_rate = 60

; Retard d'affichage des AUTRES voitures, en millisecondes. Le client les
; affiche legerement dans le passe pour toujours disposer de deux etats a
; interpoler. Doit valoir au moins 2 intervalles d'envoi (2 x 50 ms a 20 Hz).
;   60 = tres reactif mais saccade sur connexion instable
;   100 = defaut | 160 = tres lisse mais les autres voitures "trainent"
interpolation_delay_ms = 100

; Duree maximale pendant laquelle on continue d'extrapoler une voiture dont on
; n'a plus recu d'etat, en millisecondes. Au-dela, elle se fige.
max_extrapolation_ms = 150

; Nombre d'entrees que le serveur garde en reserve avant de les consommer.
; Absorbe la gigue du reseau. Bas = plus reactif mais saccade si la connexion
; est irreguliere ; chaque tick de reserve ajoute ~16 ms de latence.
server_input_buffer_ticks = 2

; Ecart de position au-dela duquel le client se corrige, en metres. En dessous,
; l'ecart est ignore : evite de rejouer en permanence pour du bruit de calcul.
reconciliation_position_threshold = 0.02

; Ecart d'orientation au-dela duquel le client se corrige, en degres.
reconciliation_rotation_threshold = 1.0

; Duree de resorption visuelle d'une correction, en secondes. La simulation est
; corrigee instantanement, mais la carrosserie rejoint sa place progressivement
; pour que l'oeil ne percoive aucun saut.
;   0.05 = correction visible | 0.12 (defaut) | 0.30 = tres doux mais "mou"
visual_correction_time = 0.12

; Nombre d'entrees conservees par le client pour pouvoir rejouer. 128 entrees
; a 60 Hz couvrent 2,1 s, soit bien plus que toute latence jouable.
input_history_size = 128

; Nombre maximal de joueurs par course.
max_players = 12

; Port par defaut du serveur.
default_port = 8910

; Transport par defaut : "websocket" (fonctionne aussi dans un navigateur) ou
; "enet" (UDP, bureau uniquement, meilleure latence sur connexion instable).
default_transport = "websocket"
